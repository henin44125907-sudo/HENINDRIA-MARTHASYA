<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Employee & Salary Data Form (Styled)</title>
    <link rel="stylesheet" href="form_styles.css">
</head>
<body>
    <h1>Employee Data and Salary Payment Input Form</h1>

    <form method="post" action="#">
        <fieldset>
            <legend>Employee Information</legend>
            <p>
                <label for="employeeName">Full Name:</label>
                <input type="text" id="employeeName" name="employeeName" required placeholder="Employee's full name">
            </p>
            <p>
                <label for="employeeID">Employee ID:</label>
                <input type="text" id="employeeID" name="employeeID" required placeholder="Employee ID/NIK">
            </p>
            <p>
                <label for="dob">Date of Birth:</label>
                <input type="date" id="dob" name="dob" required>
            </p>
            <p>
                <span class="group-label">Gender:</span><br>
                <input type="radio" id="male" name="gender" value="Male" required>
                <label for="male" class="inline-label">Male</label>
                <input type="radio" id="female" name="gender" value="Female">
                <label for="female" class="inline-label">Female</label>
            </p>
            <p>
                <label for="employeeEmail">Email Address:</label>
                <input type="email" id="employeeEmail" name="employeeEmail" placeholder="email@company.com">
            </p>
            <p>
                <label for="employeePhone">Phone Number:</label>
                <input type="text" id="employeePhone" name="employeePhone" placeholder="Example: 08123456789">
            </p>
            <p>
                <label for="position">Position:</label>
                <input type="text" id="position" name="position" placeholder="Accounting Manager / Tax Staff">
            </p>
        </fieldset>

        <fieldset>
            <legend>Salary Payment Details</legend>
            <p>
                <label for="salaryPeriod">Salary Period:</label>
                <input type="month" id="salaryPeriod" name="salaryPeriod" required>
            </p>
            <p>
                <label for="basicSalary">Basic Salary (IDR):</label>
                <input type="number" id="basicSalary" name="basicSalary" min="0" step="1000" required placeholder="Example: 5000000">
            </p>
            <p>
                <label for="transportAllowance">Transportation Allowance (IDR):</label>
                <input type="number" id="transportAllowance" name="transportAllowance" min="0" step="500" value="0">
            </p>
            <p>
                <label for="bpjsDeduction">BPJS Deduction (IDR):</label>
                <input type="number" id="bpjsDeduction" name="bpjsDeduction" min="0" step="100" value="0">
            </p>
        </fieldset>

        <p>
            <input type="submit" value="Submit Salary Data">
            <input type="reset" value="Reset Form">
        </p>
    </form>
</body>
</html>
